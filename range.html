<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action="">
        <label for="exam_score">Exam Score :</label> <br>
        <input type="range" name="exam_score" id="exam_score" min="0" max="100" value="50" step="10"> <br>
        <input type="submit" value="Save"> <br>
    </form>
</body>
</html>
