<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIme</title>
</head>
<body>
    <form action="">
        <label for="clock_in">Clock In :</label>
        <input type="time" name="clock_in" id="clock_in" value="07:00" min="07:00" max="09:30"> <br>
        <label for="clock_out">Clock Out :</label>
        <input type="time" name="clock_out" id="clock_out" value="17:00" min="17:00"> <br>
        <input type="submit" value="Save"> <br>
</body>
</html>
