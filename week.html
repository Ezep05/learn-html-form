<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week</title>
</head>
<body>
    <form action="">
        <label for="start_time">Start Time :</label>
        <input type="week" name="start_time" id="start_time" value="2026-W01" min="2026-W01" max="2026-W04"> <br>
        <label for="end_time">End Time :</label>
        <input type="week" name="end_time" id="end_time" value="2026-W50" min="2026-W46" max="2026-W50"> <br>
        <input type="submit" value="Save"> <br>
    </form>
</body>
</html>
