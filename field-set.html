<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Set</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Identity</legend>
            <label for="name">Name :</label> <input type="text" name="name" id="name"> <br>
            <label for="email">Email :</label> <input type="text" name="email" id="email"> <br>
            <label for="phone_number">Phone Number :</label> <input type="text" name="phone_number" id="phone_number"> <br>
        </fieldset>
        <fieldset>
            <legend>Education Background</legend>
            <label for="senior_high_school">Senior High School :</label> <input type="text" name="senior_high_school" id="senior_high_school"> <br>
            <label for="bachelor">Bachelor :</label> <input type="text" name="bachelor" id="bachelor"> <br>
        </fieldset>
    </form>
</body>
</html>
